# /etc/nginx/conf.d/signalrelay.conf, site in /var/www/signalrelay, certs from certbot --nginx
# replace signalrelay.example.com with the real domain

limit_req_zone $binary_remote_addr zone=license:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=metrics:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=app:10m rate=600r/m;
limit_req_status 429;

upstream signalrelay_backend {
    server 127.0.0.1:8080;
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    listen 80;
    listen [::]:80;
    server_name signalrelay.example.com www.signalrelay.example.com;
    return 301 https://signalrelay.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.signalrelay.example.com;
    ssl_certificate     /etc/letsencrypt/live/signalrelay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signalrelay.example.com/privkey.pem;
    return 301 https://signalrelay.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name signalrelay.example.com;
    root /var/www/signalrelay;

    ssl_certificate     /etc/letsencrypt/live/signalrelay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signalrelay.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    charset utf-8;
    client_max_body_size 4k;
    access_log off;   # the privacy page promises no tracking

    gzip_static on;
    # brotli_static on;   # needs ngx_brotli
    gzip on;                       # fallback for files the build didn't compress
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;
    sendfile on;
    tcp_nopush on;
    open_file_cache max=1000 inactive=60s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    location ~ /\. { deny all; }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    location ~* ^/(favicon\.svg|apple-touch-icon\.png|icon-.*\.png|og\.png|site\.webmanifest|downloads/.*)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /api/v1/licenses/generate {
        limit_req zone=license burst=3 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://signalrelay_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_read_timeout 15s;
    }
    location ~ ^/api/v1/metrics/(download|pageview)$ {
        limit_req zone=metrics burst=20 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://signalrelay_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Server;
    }
    location = /api/v1/metrics/downloads {
        limit_req zone=metrics burst=20 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://signalrelay_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_hide_header Server;
    }
    # desktop app, the backend checks the license key
    location ~ ^/api/v1/(ai/suggest|licenses/validate|updates/manifest|updates/files/.+)$ {
        limit_req zone=app burst=60 nodelay;
        proxy_pass http://signalrelay_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        client_max_body_size 16k;
    }
    location = /api/v1/support/custom-parser-requests {
        limit_req zone=license burst=3 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://signalrelay_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Server;
        client_max_body_size 512k;   # up to 15 sample messages
    }
    location /api/ { return 404; }

    location / {
        try_files $uri $uri.html =404;
    }

    error_page 404 /404.html;
    location ^~ /fr/ { error_page 404 /fr/404.html; try_files $uri $uri.html =404; }
    location ^~ /es/ { error_page 404 /es/404.html; try_files $uri $uri.html =404; }
    location ^~ /ar/ { error_page 404 /ar/404.html; try_files $uri $uri.html =404; }
}
